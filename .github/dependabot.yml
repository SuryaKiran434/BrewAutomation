version: 2

# This repo is shell scripts plus a single stdlib-only Python file. There is no
# package manifest for Dependabot to read, so github-actions is the only
# applicable ecosystem.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

    # Action majors ARE taken: GitHub deprecates old action runtimes
    # (v4/v5 tags now force onto Node 24), so these need to move.