version: 2

# This repo is shell scripts plus a single stdlib-only Python file. There is no
# package manifest for Dependabot to read, so github-actions is the only
# applicable ecosystem.
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Major versions are opted out deliberately: they carry breaking changes
    # and should be adopted intentionally, not merged unattended.
    # NOTE: security advisories still open PRs regardless of this rule, at
    # any severity -- ignore only suppresses routine version updates.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
