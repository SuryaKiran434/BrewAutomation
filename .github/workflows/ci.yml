name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN. Every job in this workflow only reads the
# repository -- checkout, dependency install, lint/test and artifact upload all
# work fine with `contents: read`. A job that ever needs to write (push a commit,
# comment on a PR, cut a release) must request that scope on itself rather than
# widening this block.
permissions:
  contents: read

jobs:
  shell:
    name: Shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Syntax check every script
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            if bash -n "$f"; then echo "ok    $f"; else echo "FAIL  $f"; fail=1; fi
          done < <(find . -name '*.sh' -not -path './.git/*' -print0)
          exit $fail

      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # -S warning: style/info notes are advisory on a mature script and
          # would turn this job red on day one for no correctness gain.
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 shellcheck -S warning -e SC1091
